<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Timeline">
  <title>Timeline</title>
  <!--
    Versión con fondo, para favicon, apple-touch-icon y el ícono de la PWA.
    El manifest lo declara "maskable", así que el sistema puede recortarlo en
    círculo: el fondo va a sangre y la marca entra holgada en el 80% central.
    De acá sale logo-web.png (512x512).
    La marca sin fondo, para usar dentro de la app, vive en logo.svg.
  -->
  <rect width="512" height="512" fill="#12161D"/>

  <g transform="translate(98.6 129.25) scale(2.113)">
    <g fill="#98A2B2">
      <rect x="3.5"   y="26" width="5" height="68" rx="2.5" opacity="0.55"/>
      <rect x="12.7"  y="26" width="5" height="68" rx="2.5" opacity="0.61"/>
      <rect x="31"    y="26" width="5" height="68" rx="2.5" opacity="0.72"/>
      <rect x="49.3"  y="26" width="5" height="68" rx="2.5" opacity="0.83"/>
      <rect x="99.8"  y="26" width="5" height="68" rx="2.5" opacity="0.86"/>
      <rect x="115.1" y="26" width="5" height="68" rx="2.5" opacity="0.77"/>
      <rect x="139.5" y="26" width="5" height="68" rx="2.5" opacity="0.62"/>
    </g>
    <rect x="75.9" y="4" width="7" height="112" rx="3.5" fill="#F7C948"/>
  </g>
</svg>
