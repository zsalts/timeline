<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargar partido - Timeline</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/svg+xml" href="../assets/image/logo-icon.svg">
    <link rel="icon" type="image/png" href="../assets/image/logo-web.png">
    <link rel="apple-touch-icon" href="../assets/image/logo-web.png">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/utils/tema.js"></script>
    <script src="../assets/js/utils/html.js"></script>
</head>

<body>

    <div id="sidebar-root" data-active="carga"></div>
    <script src="../assets/js/components/ui.js"></script>

    <div class="container-dashboard" style="max-width: 760px;">
        <div class="header-stats" style="border: none; margin-bottom: 24px;">
            <div>
                <div class="eyebrow">Nuevo registro</div>
                <h2>Cargar partido</h2>
                <p class="subtitle">Completá los datos y subí el archivo de LongoMatch o Timeline (opcional).</p>
            </div>
        </div>

        <div id="aviso-limite" style="display:none; margin-bottom:16px; padding:12px 14px; border-radius:8px; font-size:0.9rem; font-weight:600;"></div>

        <div class="card-stat" style="display: block; cursor: default;">
            <form id="form-carga" style="display: flex; flex-direction: column; gap: 18px;">

                <!-- A qué club va el partido. Solo aparece para quien trabaja en
                     más de uno (el caso típico es la analista): el resto carga
                     siempre en el suyo y no tiene nada que elegir. -->
                <div id="fila-club" style="display: none;">
                    <label for="input-club">Club</label>
                    <select id="input-club" style="margin-top: 6px;"></select>
                </div>

                <div class="form-group-row">
                    <div style="flex: 1;">
                        <label>Equipo 1 (nuestra columna)</label>
                        <select id="input-mi-equipo" required style="margin-top: 6px;">
                            <option value="" disabled selected>Seleccioná un equipo</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label>Equipo 2 (columna rival)</label>
                        <select id="input-rival" required style="margin-top: 6px;">
                            <option value="" disabled selected>Seleccioná un equipo</option>
                        </select>
                    </div>
                </div>

                <div class="form-group-row">
                    <div style="flex: 1;">
                        <label>Torneo o categoría</label>
                        <input type="text" id="input-torneo" placeholder="Ej: Torneo oficial" required style="margin-top: 6px;">
                    </div>
                    <div style="flex: 1;">
                        <label>Fecha</label>
                        <input type="date" id="input-fecha" required style="margin-top: 6px;">
                    </div>
                </div>

                <div>
                    <label>ID de YouTube</label>
                    <input type="text" id="input-youtube" placeholder="Ej: M7lc1UVf-VE" required style="margin-top: 6px;">
                </div>

                <label class="upload-box" for="input-xml">
                    <span class="upload-title">Archivo de análisis (.lgm o .xml)</span>
                    <span class="upload-sub" id="upload-filename">Opcional — hacé clic para elegir un archivo</span>
                    <input type="file" id="input-xml" accept=".lgm, .xml" style="display: none;">
                </label>

                <button type="submit" id="btn-submit" class="btn-primary" style="margin-top: 6px; padding: 14px;">
                    Guardar partido
                </button>

                <p id="mensaje-estado" style="text-align: center; font-weight: 600; margin-top: 4px;"></p>
            </form>
        </div>
    </div>


    <!-- Módulo compartido de parseo de archivos (.lgm / .xml) -->
    <script src="../assets/js/utils/parsers.js"></script>
    <!-- Planes de suscripción (límite de partidos según plan del club) -->
    <script src="../assets/js/utils/planes.js"></script>

    <!-- Guardado en Firestore (nube, multi-tenant por club_id) -->
    <script type="module">
        import { db, collection, addDoc, doc, getDoc, getDocs, query, where, writeBatch, increment, abrirClub } from '../assets/js/firebase.js';

        const uid = sessionStorage.getItem('usuarioUID');
        const clubAbierto = sessionStorage.getItem('clubID');
        if (!uid || !clubAbierto) {
            // Si no está logueado (o no tiene club), lo mandamos al login
            window.location.href = "login.html";
        }

        // A qué club va ESTE partido. Arranca en el club abierto, pero quien
        // trabaja para varios puede mandarlo a otro sin cambiar de club primero.
        // Todo lo del formulario depende de él: los equipos, el tope del plan y
        // el contador de partidos son del club destino, no del abierto.
        let clubDestino = clubAbierto;
        const misClubes = (() => {
            try {
                const l = JSON.parse(sessionStorage.getItem('clubesUsuario') || '[]');
                return Array.isArray(l) && l.length ? l : [clubAbierto];
            } catch (e) { return [clubAbierto]; }
        })();

        const form = document.getElementById('form-carga');
        const mensaje = document.getElementById('mensaje-estado');
        const btn = document.getElementById('btn-submit');

        // Muestra el nombre del archivo elegido dentro de la caja de subida
        document.getElementById('input-xml').addEventListener('change', (e) => {
            const nombreSpan = document.getElementById('upload-filename');
            nombreSpan.textContent = e.target.files[0]
                ? e.target.files[0].name
                : 'Opcional — hacé clic para elegir un archivo';
        });

        // ---- Datos de cada club (equipos y plan) ----
        // Se cachean: cambiar de club destino y volver no vuelve a pegarle a la
        // red. El nombre se guarda además en 'clubesNombres', el mismo cache que
        // usa el desplegable de la barra.
        const cacheClubes = new Map();
        async function datosDelClub(id) {
            if (cacheClubes.has(id)) return cacheClubes.get(id);
            const snap = await getDoc(doc(db, "clubes", id));
            const datos = snap.exists() ? snap.data() : null;
            cacheClubes.set(id, datos);
            return datos;
        }

        // Llena los desplegables con los equipos que cargó el admin del club
        function pintarEquipos(equipos) {
            const selects = [document.getElementById('input-mi-equipo'), document.getElementById('input-rival')];
            selects.forEach(s => {
                // Se rehace desde cero: los equipos son de cada club, así que al
                // cambiar de destino no pueden quedar los del anterior.
                s.innerHTML = '<option value="" disabled selected>Seleccioná un equipo</option>';
                if (!equipos.length) {
                    s.insertAdjacentHTML('beforeend',
                        '<option value="" disabled>— el admin del club todavía no cargó equipos —</option>');
                    return;
                }
                equipos.forEach(eq => {
                    const o = document.createElement('option');
                    o.value = eq; o.textContent = eq;
                    s.appendChild(o);
                });
            });
        }

        // ---- Límite de partidos según el plan del club ----
        // Free: 10 partidos (total). Pro/Ultra: ilimitado. Pizarrón: ninguno,
        // es un plan solo de entrenamiento y táctica.
        // Ojo: el plan es el del club DESTINO, no el de la sesión, así que no se
        // pueden usar los helpers ...Actual() de TL.planes.
        let limitePartidos = Infinity;
        let nombrePlan = '';
        const aviso = document.getElementById('aviso-limite');

        async function contarPartidos() {
            const snap = await getDocs(query(collection(db, "partidos"), where("club_id", "==", clubDestino)));
            return snap.size;
        }

        function pintarAviso(texto, tipo) {
            // tipo: 'info' (quedan cupos) | 'bloqueo' (llegó al tope)
            aviso.style.display = 'block';
            aviso.textContent = texto;
            if (tipo === 'bloqueo') {
                aviso.style.background = 'var(--danger-dim)';
                aviso.style.color = '#ffb3b6';
                aviso.style.border = '1px solid rgba(255, 92, 99, 0.35)';
            } else {
                aviso.style.background = 'var(--panel-2)';
                aviso.style.color = 'var(--muted)';
                aviso.style.border = '1px solid var(--line)';
            }
        }

        function bloquearFormulario(texto) {
            btn.disabled = true;
            btn.textContent = texto || "Límite alcanzado";
        }

        function desbloquearFormulario() {
            btn.disabled = false;
            btn.textContent = "Guardar partido";
        }

        // ---- Preparar el formulario para un club destino ----
        // Corre al entrar y cada vez que se elige otro club: los equipos, el
        // plan y el tope son de ese club.
        async function usarClub(id) {
            clubDestino = id;
            aviso.style.display = 'none';
            desbloquearFormulario();

            let club = null;
            try {
                club = await datosDelClub(id);
            } catch (e) {
                console.error("No se pudieron leer los datos del club:", e);
            }
            if (!club) {
                pintarEquipos([]);
                pintarAviso('No pudimos leer los datos de ese club. Revisá tu conexión.', 'bloqueo');
                bloquearFormulario("Sin datos del club");
                return;
            }

            pintarEquipos(club.equipos || []);
            limitePartidos = TL.planes.limite(club.plan, 'partidos');
            nombrePlan = TL.planes.info(club.plan).nombre;

            // El plan no incluye partidos (Pizarrón): ni contamos, se bloquea.
            if (limitePartidos === 0) {
                pintarAviso(`El plan ${nombrePlan} es solo de entrenamiento y táctica: no incluye carga de partidos. Pasá a Pro o Ultra para analizar video.`, 'bloqueo');
                bloquearFormulario("No incluido en su plan");
                return;
            }
            if (limitePartidos === Infinity) return;   // Pro/Ultra: sin tope que avisar

            // Hay tope pero se pueden cargar (plan Free).
            try {
                const usados = await contarPartidos();
                if (id !== clubDestino) return;        // cambiaron de club mientras contábamos
                if (usados >= limitePartidos) {
                    pintarAviso(`Llegaste al límite del plan ${nombrePlan} (${limitePartidos} partidos). Pasá a Pro para cargar partidos ilimitados.`, 'bloqueo');
                    bloquearFormulario();
                } else {
                    pintarAviso(`Plan ${nombrePlan}: ${usados} de ${limitePartidos} partidos usados.`, 'info');
                }
            } catch (e) {
                console.error("No se pudo verificar el límite de partidos:", e);
            }
        }

        // ---- Selector de club destino ----
        // Solo para quien trabaja en más de uno. Los nombres salen del cache de
        // la barra; los que falten se completan con el doc de cada club.
        (async function armarSelectorDeClub() {
            if (misClubes.length < 2) {
                usarClub(clubAbierto);
                return;
            }
            const sel = document.getElementById('input-club');
            const nombres = (() => {
                try { return JSON.parse(sessionStorage.getItem('clubesNombres') || '{}'); }
                catch (e) { return {}; }
            })();
            misClubes.forEach(id => {
                const o = document.createElement('option');
                o.value = id;
                o.textContent = nombres[id] || id;
                sel.appendChild(o);
            });
            sel.value = clubAbierto;
            document.getElementById('fila-club').style.display = '';
            sel.addEventListener('change', () => usarClub(sel.value));

            await usarClub(clubAbierto);

            // Completar los nombres que no estaban cacheados. De paso marca los
            // clubes cuyo plan no incluye partidos: mejor que no se puedan
            // elegir a dejar elegirlos y después bloquear el formulario.
            await Promise.all(misClubes.map(async (id) => {
                try {
                    const club = await datosDelClub(id);
                    if (!club) return;
                    nombres[id] = club.nombre || id;
                    const op = sel.querySelector(`option[value="${CSS.escape(id)}"]`);
                    if (!op) return;
                    op.textContent = nombres[id];
                    if (TL.planes.limite(club.plan, 'partidos') === 0) {
                        op.textContent += ' (su plan no incluye partidos)';
                        op.disabled = id !== clubAbierto;
                    }
                } catch (e) { /* sin permiso o sin red: queda el id */ }
            }));
            try { sessionStorage.setItem('clubesNombres', JSON.stringify(nombres)); } catch (e) { }
        })();

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            // Reverificar el tope justo antes de guardar (evita saltarlo).
            if (limitePartidos === 0) {
                pintarAviso(`El plan ${nombrePlan} es solo de entrenamiento y táctica: no incluye carga de partidos. Pasá a Pro o Ultra para analizar video.`, 'bloqueo');
                bloquearFormulario("No incluido en su plan");
                return;
            }
            if (limitePartidos !== Infinity) {
                try {
                    const usados = await contarPartidos();
                    if (usados >= limitePartidos) {
                        pintarAviso(`Llegaste al límite del plan ${nombrePlan} (${limitePartidos} partidos). Pasá a Pro para cargar partidos ilimitados.`, 'bloqueo');
                        bloquearFormulario();
                        return;
                    }
                } catch (e) {
                    console.error("No se pudo verificar el límite de partidos:", e);
                }
            }

            const file = document.getElementById('input-xml').files[0];

            btn.disabled = true;
            btn.textContent = "Procesando...";
            // Cambiar de club a mitad del guardado dejaría el formulario
            // (equipos, tope) de un club y el partido yéndose a otro.
            document.getElementById('input-club').disabled = true;
            mensaje.style.color = "var(--muted)";
            mensaje.textContent = file ? "Leyendo archivo y guardando en la nube..." : "Guardando partido sin cortes...";

            const idYoutube = document.getElementById('input-youtube').value;
            // club_id: sella el partido para que solo lo vea este club (multi-tenant)
            const partidoNuevo = {
                mi_equipo: document.getElementById('input-mi-equipo').value,
                rival: document.getElementById('input-rival').value,
                fecha: document.getElementById('input-fecha').value,
                torneo: document.getElementById('input-torneo').value,
                video_url: idYoutube,
                youtube_id: idYoutube,
                club_id: clubDestino,
                creado_por: uid,
                importante: false,
                creado_el: new Date().toISOString()
            };

            const guardarEnBaseDeDatos = async (datos) => {
                try {
                    // Escritura atómica: se crea el partido y se incrementa el
                    // contador del club en la misma operación. La regla de
                    // Firestore lee ese contador para hacer cumplir el tope del
                    // plan Free (ver firestore.rules). Si no van juntos, la regla
                    // no puede contar partidos y el tope sería solo del cliente.
                    const batch = writeBatch(db);
                    const nuevoRef = doc(collection(db, "partidos"));
                    batch.set(nuevoRef, datos);
                    // El contador es el del club del partido (datos.club_id) y
                    // no el del select: entre el submit y el commit hay un
                    // FileReader de por medio, así que el destino se toma del
                    // partido que se está escribiendo y no de lo que esté
                    // elegido en ese instante.
                    batch.update(doc(db, "clubes", datos.club_id), { partidos_count: increment(1) });
                    await batch.commit();
                    // Si el partido fue a otro club, dejamos ESE club abierto:
                    // el historial al que caemos es el suyo, así que se ve lo
                    // que se acaba de cargar. Mismo criterio que el historial
                    // cuando abrís un partido de otro club.
                    if (datos.club_id !== clubAbierto) {
                        try { await abrirClub(datos.club_id, cacheClubes.get(datos.club_id)); }
                        catch (e) { console.error("No se pudo abrir el club destino:", e); }
                    }
                    mensaje.style.color = "var(--live)";
                    mensaje.textContent = "¡Éxito! Redirigiendo al historial...";
                    setTimeout(() => {
                        window.location.href = "historial.html";
                    }, 1500);
                } catch (error) {
                    console.error("Error al guardar: ", error);
                    mensaje.style.color = "var(--danger)";
                    mensaje.textContent = "Error al guardar en la nube. Revisá la consola.";
                    btn.disabled = false;
                    btn.textContent = "Reintentar";
                    document.getElementById('input-club').disabled = false;
                }
            };

            if (file) {
                const reader = new FileReader();
                reader.onload = async function (evento) {
                    try {
                        const contenidoArchivo = evento.target.result;
                        partidoNuevo.estadisticas = TL.parsers.procesarArchivo(contenidoArchivo);
                        await guardarEnBaseDeDatos(partidoNuevo);

                    } catch (error) {
                        console.error("Error al procesar archivo: ", error);
                        mensaje.style.color = "var(--danger)";
                        mensaje.textContent = "Error al procesar el archivo de cortes. Revisá la consola.";
                        btn.disabled = false;
                        btn.textContent = "Reintentar";
                        document.getElementById('input-club').disabled = false;
                    }
                };
                reader.readAsText(file);
            } else {
                partidoNuevo.estadisticas = {};
                await guardarEnBaseDeDatos(partidoNuevo);
            }
        });
    </script>
</body>

</html>
