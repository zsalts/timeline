<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes - Timeline</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/svg+xml" href="../assets/image/logo-icon.svg">
    <link rel="icon" type="image/png" href="../assets/image/logo-web.png">
    <link rel="apple-touch-icon" href="../assets/image/logo-web.png">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/utils/tema.js"></script>
    <script src="../assets/js/utils/html.js"></script>
    <style>
        .chat-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 16px;
            align-items: start;
        }

        /* --- Columna de contactos / conversaciones --- */
        .chat-side {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 14px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .chat-side h3 {
            font-family: var(--font-mono);
            font-size: 0.64rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--faint);
            margin: 0 0 8px;
            font-weight: 500;
        }
        .chat-side h3 + h3 { margin-top: 18px; }

        .persona {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 9px;
            cursor: pointer;
            transition: background 0.15s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
        .persona:hover { background: var(--panel-2); }
        .persona.activa { background: var(--accent-dim); }
        .persona.activa .persona-nombre { color: var(--accent); font-weight: 600; }

        .avatar {
            width: 32px; height: 32px; flex-shrink: 0;
            border-radius: 50%;
            background: var(--panel-3);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 700;
        }
        .persona-datos { min-width: 0; flex: 1; }
        .persona-nombre {
            color: var(--text); font-size: 0.9rem; font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .persona-sub {
            color: var(--faint); font-size: 0.76rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .sin-leer {
            background: var(--accent); color: var(--accent-ink);
            border-radius: 999px; font-size: 0.68rem; font-weight: 700;
            padding: 1px 7px; flex-shrink: 0;
        }

        /* --- Panel de la conversación --- */
        .chat-main {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            height: 70vh;
        }
        .chat-head {
            padding: 14px 18px;
            border-bottom: 1px solid var(--line);
            display: flex; align-items: center; gap: 10px;
            flex-shrink: 0;
        }
        .chat-head .persona-nombre { font-weight: 600; }

        .chat-mensajes {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .burbuja {
            max-width: 74%;
            padding: 9px 13px;
            border-radius: 14px;
            font-size: 0.92rem;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .burbuja.mia {
            align-self: flex-end;
            background: var(--accent);
            color: var(--accent-ink);
            border-bottom-right-radius: 4px;
        }
        .burbuja.suya {
            align-self: flex-start;
            background: var(--panel-2);
            color: var(--text);
            border: 1px solid var(--line);
            border-bottom-left-radius: 4px;
        }
        .burbuja-hora {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.66rem;
            opacity: 0.65;
            margin-top: 4px;
        }

        .chat-form {
            display: flex; gap: 8px;
            padding: 12px;
            border-top: 1px solid var(--line);
            flex-shrink: 0;
        }
        .chat-form textarea {
            flex: 1;
            resize: none;
            min-height: 42px;
            max-height: 120px;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 0.92rem;
        }
        .btn-enviar {
            background: var(--accent); color: var(--accent-ink);
            border: none; border-radius: var(--radius-sm);
            padding: 0 20px; font-weight: 700; cursor: pointer;
            width: auto; font-family: inherit; flex-shrink: 0;
        }
        .btn-enviar:hover { filter: brightness(1.08); }
        .btn-enviar:disabled { opacity: 0.5; cursor: default; }

        .chat-vacio {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            color: var(--muted); font-size: 0.92rem; text-align: center;
            padding: 30px;
        }

        @media (max-width: 860px) {
            .chat-layout { grid-template-columns: 1fr; }
            .chat-side { max-height: 240px; }
            .chat-main { height: 60vh; }
            /* Con la conversación abierta, en celular la lista se esconde */
            body.chat-abierto .chat-side { display: none; }
        }
    </style>
</head>

<body>

    <div id="sidebar-root" data-active="mensajes"></div>
    <script src="../assets/js/components/ui.js"></script>

    <div class="container-dashboard">
        <div class="header-stats" style="border:none; margin-bottom:18px;">
            <div>
                <div class="eyebrow">Chat interno</div>
                <h2>Mensajes</h2>
                <p class="subtitle">Conversaciones privadas con la gente de tu club.</p>
            </div>
        </div>

        <div class="chat-layout">
            <aside class="chat-side">
                <h3>Conversaciones</h3>
                <div id="lista-conversaciones">
                    <p style="color: var(--muted); font-size: 0.86rem;">Cargando…</p>
                </div>

                <h3>Gente del club</h3>
                <div id="lista-personas">
                    <p style="color: var(--muted); font-size: 0.86rem;">Cargando…</p>
                </div>
            </aside>

            <section class="chat-main">
                <div class="chat-head" id="chat-head" style="display:none;">
                    <div class="avatar" id="head-avatar"></div>
                    <div class="persona-datos">
                        <div class="persona-nombre" id="head-nombre"></div>
                        <div class="persona-sub" id="head-sub"></div>
                    </div>
                </div>

                <div class="chat-vacio" id="chat-vacio">
                    Elegí a alguien de tu club para empezar a conversar.
                </div>

                <div class="chat-mensajes" id="chat-mensajes" style="display:none;"></div>

                <form class="chat-form" id="chat-form" style="display:none;">
                    <textarea id="chat-texto" placeholder="Escribí tu mensaje…" maxlength="2000" rows="1"></textarea>
                    <button type="submit" class="btn-enviar" id="btn-enviar">Enviar</button>
                </form>
            </section>
        </div>
    </div>

    <script type="module">
        import {
            db, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc,
            query, where, orderBy, limit, onSnapshot, serverTimestamp
        } from '../assets/js/firebase.js';

        const uid = sessionStorage.getItem('usuarioUID');
        const clubId = sessionStorage.getItem('clubID');
        const miNombre = sessionStorage.getItem('userEmail') || '';
        if (!uid || !clubId) window.location.href = "login.html";

        const ROLES = {
            'club-admin': 'Administradora del club',
            trainer: 'Entrenadora',
            coordinator: 'Coordinadora',
            analyst: 'Analista',
            player: 'Jugadora'
        };

        let personas = [];          // gente del club (sin mí)
        let conversaciones = [];    // mis conversaciones
        let convActual = null;      // { id, otroUid }
        let cortarMensajes = null;  // corta el onSnapshot del hilo abierto
        let cortarConvs = null;
        let hiloVivo = false;       // ¿la suscripción al hilo sigue en pie?

        const $ = id => document.getElementById(id);
        const iniciales = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();

        // El id de la conversación se deriva de los dos uid ordenados, así los
        // dos lados calculan el MISMO id y no se crean dos hilos paralelos.
        const idConversacion = (a, b) => `${clubId}__${[a, b].sort().join('_')}`;

        function hora(ts) {
            if (!ts) return '';
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            return d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
        }

        // --- Cargar la gente del club ---
        async function cargarPersonas() {
            const cont = $('lista-personas');
            try {
                const snap = await getDocs(query(collection(db, 'usuarios'), where('club_id', '==', clubId)));
                personas = [];
                snap.forEach(d => { if (d.id !== uid) personas.push({ uid: d.id, ...d.data() }); });
                personas.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es'));

                if (!personas.length) {
                    cont.innerHTML = '<p style="color: var(--muted); font-size: 0.86rem;">Todavía no hay nadie más en el club.</p>';
                    return;
                }
                cont.innerHTML = '';
                personas.forEach(p => cont.appendChild(filaPersona(p, ROLES[p.rol] || p.rol)));
            } catch (e) {
                console.error('Error al cargar la gente del club:', e);
                cont.innerHTML = '<p style="color: var(--muted); font-size: 0.86rem;">No se pudo cargar la lista.</p>';
            }
        }

        function filaPersona(p, sub, badge) {
            const b = document.createElement('button');
            b.className = 'persona' + (convActual && convActual.otroUid === p.uid ? ' activa' : '');
            b.innerHTML = `
                <span class="avatar">${TL.esc(iniciales(p.nombre))}</span>
                <span class="persona-datos">
                    <span class="persona-nombre">${TL.esc(p.nombre || p.email || 'Sin nombre')}</span>
                    <span class="persona-sub">${TL.esc(sub || '')}</span>
                </span>
                ${badge ? `<span class="sin-leer">${TL.esc(badge)}</span>` : ''}`;
            b.onclick = () => abrirConversacion(p.uid);
            return b;
        }

        // --- Mis conversaciones, en vivo ---
        function escucharConversaciones() {
            // Sin orderBy a propósito: array-contains + orderBy pide un índice
            // compuesto. Son pocas conversaciones, se ordenan acá.
            const q = query(collection(db, 'conversaciones'), where('participantes', 'array-contains', uid));
            cortarConvs = onSnapshot(q, (snap) => {
                conversaciones = [];
                snap.forEach(d => conversaciones.push({ id: d.id, ...d.data() }));
                conversaciones.sort((a, b) => (b.actualizado_en?.seconds || 0) - (a.actualizado_en?.seconds || 0));
                pintarConversaciones();
            }, (e) => {
                console.error('Error al escuchar conversaciones:', e);
                $('lista-conversaciones').innerHTML = '<p style="color: var(--muted); font-size: 0.86rem;">No se pudieron cargar.</p>';
            });
        }

        function pintarConversaciones() {
            const cont = $('lista-conversaciones');
            if (!conversaciones.length) {
                cont.innerHTML = '<p style="color: var(--muted); font-size: 0.86rem;">Todavía no tenés conversaciones.</p>';
                return;
            }
            cont.innerHTML = '';
            conversaciones.forEach(c => {
                const otroUid = (c.participantes || []).find(x => x !== uid);
                const p = personas.find(x => x.uid === otroUid)
                    || { uid: otroUid, nombre: (c.nombres || {})[otroUid] || 'Alguien' };
                const ultimo = c.ultimo ? `${c.ultimo.de === uid ? 'Vos: ' : ''}${c.ultimo.texto}` : '';
                cont.appendChild(filaPersona(p, ultimo));
            });
        }

        // --- Abrir / crear la conversación con alguien ---
        async function abrirConversacion(otroUid) {
            const convId = idConversacion(uid, otroUid);
            convActual = { id: convId, otroUid };
            document.body.classList.add('chat-abierto');

            const p = personas.find(x => x.uid === otroUid) || { nombre: 'Alguien' };
            $('head-avatar').textContent = iniciales(p.nombre);
            $('head-nombre').textContent = p.nombre || p.email || 'Sin nombre';
            $('head-sub').textContent = ROLES[p.rol] || p.rol || '';
            $('chat-head').style.display = 'flex';
            $('chat-vacio').style.display = 'none';
            $('chat-mensajes').style.display = 'flex';
            $('chat-form').style.display = 'flex';
            $('chat-mensajes').innerHTML = '';

            pintarConversaciones();
            cargarPersonas();

            escucharMensajes(convId);
        }

        // Escucha el hilo en vivo. Ojo: si la conversación todavía NO existe, la
        // regla de 'mensajes' hace un get() sobre un documento inexistente, eso
        // da permission-denied y Firestore CANCELA la suscripción para siempre.
        // Por eso se marca hiloVivo=false y se vuelve a enganchar después del
        // primer mensaje (cuando la conversación ya quedó creada).
        function escucharMensajes(convId) {
            if (cortarMensajes) cortarMensajes();
            hiloVivo = true;
            const q = query(collection(db, 'conversaciones', convId, 'mensajes'), orderBy('en', 'asc'), limit(200));
            cortarMensajes = onSnapshot(q, (snap) => {
                const cont = $('chat-mensajes');
                cont.innerHTML = '';
                snap.forEach(d => {
                    const m = d.data();
                    const div = document.createElement('div');
                    div.className = 'burbuja ' + (m.de === uid ? 'mia' : 'suya');
                    div.textContent = m.texto;
                    const h = document.createElement('span');
                    h.className = 'burbuja-hora';
                    h.textContent = hora(m.en);
                    div.appendChild(h);
                    cont.appendChild(div);
                });
                cont.scrollTop = cont.scrollHeight;
            }, (e) => {
                hiloVivo = false;
                if (e.code !== 'permission-denied') console.error('Error en el hilo:', e);
            });
        }

        // --- Enviar ---
        $('chat-form').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const texto = $('chat-texto').value.trim();
            if (!texto || !convActual) return;

            const btn = $('btn-enviar');
            btn.disabled = true;
            try {
                const convRef = doc(db, 'conversaciones', convActual.id);
                const otro = personas.find(x => x.uid === convActual.otroUid) || {};
                const resumen = {
                    club_id: clubId,
                    participantes: [uid, convActual.otroUid].sort(),
                    nombres: {
                        [uid]: sessionStorage.getItem('userNombre') || miNombre,
                        [convActual.otroUid]: otro.nombre || otro.email || ''
                    },
                    ultimo: { texto: texto.slice(0, 120), de: uid },
                    actualizado_en: serverTimestamp()
                };

                // La primera vez crea la conversación; después solo actualiza el
                // resumen. setDoc con merge sirve para los dos casos.
                await setDoc(convRef, resumen, { merge: true });
                await addDoc(collection(db, 'conversaciones', convActual.id, 'mensajes'), {
                    de: uid, texto, en: serverTimestamp()
                });

                $('chat-texto').value = '';
                $('chat-texto').style.height = 'auto';

                // Si la suscripción se había caído porque la conversación no
                // existía, ahora sí existe: volvemos a engancharla.
                if (!hiloVivo) escucharMensajes(convActual.id);
            } catch (e) {
                console.error('Error al enviar el mensaje:', e);
                alert('No se pudo enviar el mensaje.');
            } finally {
                btn.disabled = false;
                $('chat-texto').focus();
            }
        });

        // Enter envía, Shift+Enter hace salto de línea
        $('chat-texto').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                $('chat-form').requestSubmit();
            }
        });
        // El textarea crece con el texto
        $('chat-texto').addEventListener('input', (e) => {
            e.target.style.height = 'auto';
            e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
        });

        window.addEventListener('beforeunload', () => {
            if (cortarMensajes) cortarMensajes();
            if (cortarConvs) cortarConvs();
        });

        (async function iniciar() {
            await cargarPersonas();
            escucharConversaciones();
        })();
    </script>
</body>

</html>
