<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - Timeline Analytics</title>

    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/svg+xml" href="../assets/image/logo-icon.svg">
    <link rel="icon" type="image/png" href="../assets/image/logo-web.png">
    <link rel="apple-touch-icon" href="../assets/image/logo-web.png">
    <meta name="theme-color" content="#0B0E13">

    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/utils/tema.js"></script>
    <script src="../assets/js/utils/html.js"></script>
    <script src="../assets/js/components/timeline.js"></script>
    <style>
        .buscador-row { margin-top: 2px; }
        #buscador { max-width: 460px; }

        /* Alcance del historial: este club o todos los míos */
        .alcance-select {
            width: auto;
            padding: 8px 12px;
            font-size: 0.86rem;
            font-family: inherit;
        }
        /* De qué club es el partido (solo en modo "todos mis clubes") */
        .chip-club {
            background: var(--panel-3);
            color: var(--text);
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            margin-left: 8px;
            text-transform: none;
        }

        /* Filtro por categoría del club */
        .cat-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
        .cat-label {
            font-family: var(--font-mono);
            font-size: 0.64rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--faint);
        }
        .cat-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .cat-chip {
            background: var(--panel-2);
            border: 1px solid var(--line);
            color: var(--muted);
            border-radius: 999px;
            padding: 6px 13px;
            font-size: 0.84rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            width: auto;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .cat-chip:hover { background: var(--panel-3); color: var(--text); }
        .cat-chip.activa {
            background: var(--accent-dim);
            border-color: var(--accent-line);
            color: var(--accent);
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div id="sidebar-root" data-active="historial"></div>
    <script src="../assets/js/components/ui.js"></script>

    <div class="container-dashboard">
        <div class="header-stats">
            <div class="header-stats-top">
                <div>
                    <div class="eyebrow" id="eyebrow-club">Videoanálisis</div>
                    <h2 id="titulo-club">Historial</h2>
                </div>
                <a href="carga.html" class="btn-primary" id="btn-nuevo-partido">+ Nuevo partido</a>
            </div>

            <div class="buscador-row">
                <input type="text" id="buscador" placeholder="Buscar por equipo o torneo">
            </div>

            <!-- Solo para quien trabaja en más de un club. Es de lectura: mezcla
                 los partidos de todos, pero cargar o editar sigue necesitando un
                 club abierto. -->
            <div class="cat-row" id="alcance-row" style="display: none;">
                <span class="cat-label">Ver</span>
                <select id="sel-alcance" class="alcance-select" aria-label="Qué partidos mostrar">
                    <option value="uno">Solo este club</option>
                    <option value="todos">Todos mis clubes</option>
                </select>
            </div>

            <!-- Filtro por categoría del club: se arma con las categorías que
                 aparecen en los partidos, así nunca ofrece una lista vacía. -->
            <div class="cat-row" id="cat-row" style="display: none;">
                <span class="cat-label">Categoría</span>
                <div class="cat-chips" id="cat-chips"></div>
            </div>
        </div>

        <div id="lista-tc" class="grid-partidos">
            <p style="color: var(--muted);">Cargando partidos…</p>
        </div>

        <div id="seccion-compartidos" style="display: none;">
            <h3 style="margin: 34px 0 4px;">Compartidos conmigo</h3>
            <p class="subtitle" style="margin: 0 0 14px;">Videos con cortes que otras cuentas te compartieron.</p>
            <div id="lista-compartidos" class="grid-partidos"></div>
        </div>
    </div>

    <script type="module">
        import { db, collection, query, where, getDocs, getDoc, doc, deleteDoc, updateDoc, writeBatch, increment } from '../assets/js/firebase.js';

        // 1. Verificación de seguridad
        const uid = sessionStorage.getItem('usuarioUID');
        const miClubId = sessionStorage.getItem('clubID');

        if (!uid || !miClubId) {
            window.location.href = "login.html";
        }

        // 2. Personalización: el nombre del club va en el eyebrow
        const configClubStr = sessionStorage.getItem('configClub');
        if(configClubStr) {
            const configClub = JSON.parse(configClubStr);
            document.title = `Historial · ${configClub.nombre}`;
            if (configClub.nombre) document.getElementById('eyebrow-club').textContent = configClub.nombre;
        }

        // Las jugadoras solo miran: no ven el botón de cargar partido
        // ni las acciones de las cards (editar / borrar / prioritario)
        const esJugadora = sessionStorage.getItem('userRole') === 'player';
        if (esJugadora) {
            document.getElementById('btn-nuevo-partido').style.display = 'none';
        }

        let partidosGlobal = [];

        // --- Alcance: este club o todos los míos ---
        // Quien trabaja para varios clubes (una analista, una entrenadora) puede
        // ver el historial completo sin ir cambiando de club con el selector de
        // la barra. Es SOLO lectura: cargar un partido, el tope del plan y las
        // estadísticas siguen necesitando un club abierto, así que el club
        // activo no se toca al mirar en modo "todos".
        const misClubes = (() => {
            try {
                const l = JSON.parse(sessionStorage.getItem('clubesUsuario') || '[]');
                return Array.isArray(l) && l.length ? l : [miClubId];
            } catch (e) { return [miClubId]; }
        })();
        const nombresClubes = (() => {
            try { return JSON.parse(sessionStorage.getItem('clubesNombres') || '{}'); }
            catch (e) { return {}; }
        })();

        const selAlcance = document.getElementById('sel-alcance');
        let verTodos = sessionStorage.getItem('historialTodosClubes') === '1';

        if (misClubes.length > 1) {
            document.getElementById('alcance-row').style.display = '';
            selAlcance.value = verTodos ? 'todos' : 'uno';
            selAlcance.addEventListener('change', () => {
                verTodos = selAlcance.value === 'todos';
                sessionStorage.setItem('historialTodosClubes', verTodos ? '1' : '0');
                pintarEncabezado();
                cargarHistorial();
            });
        } else {
            verTodos = false;
        }

        // Los datos de cada club, para poner su nombre en la tarjeta y para
        // poder abrir el club correcto si el partido es de otro.
        const datosClubes = {};
        async function completarNombresDeClubes() {
            const faltan = misClubes.filter(id => !datosClubes[id]);
            await Promise.all(faltan.map(async (id) => {
                try {
                    const s = await getDoc(doc(db, 'clubes', id));
                    if (s.exists()) {
                        datosClubes[id] = s.data();
                        nombresClubes[id] = s.data().nombre || id;
                    }
                } catch (e) { /* si no se puede leer, queda el id */ }
            }));
            try { sessionStorage.setItem('clubesNombres', JSON.stringify(nombresClubes)); } catch (e) { }
        }

        function pintarEncabezado() {
            const cfg = JSON.parse(sessionStorage.getItem('configClub') || '{}');
            const texto = verTodos ? 'Todos mis clubes' : (cfg.nombre || 'Videoanálisis');
            document.getElementById('eyebrow-club').textContent = texto;
            document.title = `Historial · ${texto}`;
        }

        // 3. Cargar Partidos desde Firestore (Filtrado por Club)
        async function cargarHistorial() {
            const listaTC = document.getElementById('lista-tc');

            try {
                // Un club, o todos los míos. El 'in' de Firestore banca hasta 30
                // valores; nadie va a estar en más de 30 clubes, pero si pasara
                // se recorta y al menos no rompe la consulta.
                const consultaPrivada = verTodos
                    ? query(collection(db, "partidos"), where("club_id", "in", misClubes.slice(0, 30)))
                    : query(collection(db, "partidos"), where("club_id", "==", miClubId));
                const querySnapshot = await getDocs(consultaPrivada);

                partidosGlobal = [];
                querySnapshot.forEach((doc) => {
                    partidosGlobal.push({ id: doc.id, ...doc.data() });
                });

                if (partidosGlobal.length === 0) {
                    listaTC.innerHTML = '<p style="color: var(--muted);">Todavía no hay partidos cargados. Empezá con “+ Nuevo partido”.</p>';
                    return;
                }

                if (verTodos) await completarNombresDeClubes();

                renderCategorias();
                renderizarPartidos(partidosGlobal);
            } catch (error) {
                console.error("Error al conectar con Firestore: ", error);
                listaTC.innerHTML = '<p style="color: var(--danger);">Error al sincronizar con la base de datos.</p>';
            }
        }

        function renderizarPartidos(partidos) {
            const listaTC = document.getElementById('lista-tc');
            listaTC.innerHTML = '';

            if (partidos.length === 0) {
                listaTC.innerHTML = '<p style="color: var(--muted);">Sin resultados para la búsqueda.</p>';
                return;
            }

            const partidosOrdenados = partidos.sort((a, b) => {
                const esImpA = !!a.importante;
                const esImpB = !!b.importante;
                if (esImpA !== esImpB) return esImpA ? -1 : 1;
                const tiempoA = new Date(a.fecha || 0).getTime();
                const tiempoB = new Date(b.fecha || 0).getTime();
                return tiempoB - tiempoA;
            });

            partidosOrdenados.forEach((partido) => {
                const card = crearCard(partido);
                // Si quieres puedes seguir dividiendo por texto o lo metemos todo a principales
                listaTC.appendChild(card); 
            });
        }

        function crearCard(partido) {
            const card = document.createElement('div');
            card.className = 'card-stat';

            const equipo1 = partido.mi_equipo || 'Nuestro equipo';
            const equipo2 = partido.rival || 'Rival';
            const esImportante = !!partido.importante;

            const res = TL.timeline.resumen(partido.estadisticas);
            const badge = esImportante ? '<span class="badge-proximo">PRÓXIMO</span>' : '';
            const estrella = esImportante ? '★' : '☆';

            // En modo "todos mis clubes" cada tarjeta dice de qué club es; si no,
            // dos partidos de clubes distintos se ven idénticos.
            const esDeOtroClub = partido.club_id && partido.club_id !== miClubId;
            const chipClub = (verTodos && partido.club_id)
                ? `<span class="chip-club">${TL.esc(nombresClubes[partido.club_id] || partido.club_id)}</span>`
                : '';

            card.innerHTML = `
                <div class="match-top">
                    <div class="match-torneo">${TL.esc(partido.torneo || 'Amistoso')} ${badge} ${chipClub}</div>
                    <div class="match-acciones">
                        <button class="icon-btn btn-importante ${esImportante ? 'on' : ''}" title="Marcar como prioritario">${estrella}</button>
                        <button class="icon-btn btn-editar" title="Editar">✎</button>
                        <button class="icon-btn btn-borrar" title="Borrar">✕</button>
                    </div>
                </div>
                <div class="match-teams">
                    <div class="match-eq1">${TL.esc(equipo1)}</div>
                    <div class="match-vs">vs</div>
                    <div class="match-eq2">${TL.esc(equipo2)}</div>
                </div>
                <div class="match-meta">
                    <span class="match-fecha">${TL.esc(partido.fecha || 'Sin fecha')}</span>
                    <span class="match-count"><b>${res.total}</b> cortes · ${res.categorias} cat</span>
                </div>
                <div class="tl-slot"></div>
            `;

            // Firma: tira de timeline del partido
            card.querySelector('.tl-slot').appendChild(TL.timeline.crear(partido.estadisticas));

            // Las acciones (prioritario, editar, borrar) trabajan sobre el club
            // abierto: los equipos del formulario, el contador de partidos del
            // plan y quién puede borrar salen de ahí. Sobre un partido de OTRO
            // club se esconden; para tocarlo hay que abrirlo, que es lo que
            // cambia de club.
            if (esJugadora || (verTodos && esDeOtroClub)) {
                card.querySelector('.match-acciones').style.display = 'none';
            }

            card.onclick = async () => {
                // Abrir un partido de otro club mueve el club activo: si no,
                // el video cargaría las tácticas y el plan del club equivocado.
                if (esDeOtroClub && datosClubes[partido.club_id]) {
                    sessionStorage.setItem('clubID', partido.club_id);
                    sessionStorage.setItem('configClub', JSON.stringify(datosClubes[partido.club_id]));
                    sessionStorage.setItem('isClubAdmin',
                        String(datosClubes[partido.club_id].admin_uid === uid));
                    try { localStorage.setItem('ultimoClub', partido.club_id); } catch (_) { }
                }
                sessionStorage.setItem('partidoSeleccionadoId', partido.id);
                window.location.href = 'video.html';
            };

            // Marcar / desmarcar prioritario
            card.querySelector('.btn-importante').onclick = async (e) => {
                e.stopPropagation();
                try {
                    await updateDoc(doc(db, "partidos", partido.id), { importante: !esImportante });
                    cargarHistorial();
                } catch (error) {
                    console.error(error);
                    alert("No se pudo actualizar el partido.");
                }
            };

            // Borrar en la nube
            card.querySelector('.btn-borrar').onclick = async (e) => {
                e.stopPropagation();
                if (confirm(`¿Borrar partido contra ${equipo2}?`)) {
                    try {
                        // Atómico: borra el partido y baja el contador del club
                        // (usado por el tope del plan Free). Ver firestore.rules.
                        const batch = writeBatch(db);
                        batch.delete(doc(db, "partidos", partido.id));
                        batch.update(doc(db, "clubes", miClubId), { partidos_count: increment(-1) });
                        await batch.commit();
                        cargarHistorial();
                    } catch (error) {
                        console.error(error);
                        alert("Error al borrar el partido.");
                    }
                }
            };

            // Editar todo el partido (equipos, torneo, fecha, video, cortes)
            card.querySelector('.btn-editar').onclick = (e) => {
                e.stopPropagation();
                sessionStorage.setItem('partidoAEditarId', partido.id);
                window.location.href = 'editar.html';
            };

            return card;
        }

        // --- Compartidos conmigo (videos con cortes de otras cuentas) ---
        async function cargarCompartidos() {
            const seccion = document.getElementById('seccion-compartidos');
            seccion.style.display = 'none';
            const miEmail = (sessionStorage.getItem('userEmail') || '').toLowerCase();
            if (!miEmail) return;

            try {
                const q = query(collection(db, "compartidos"), where("para_email", "==", miEmail));
                const snap = await getDocs(q);
                if (snap.empty) return;

                const items = [];
                snap.forEach(d => items.push({ id: d.id, ...d.data() }));
                items.sort((a, b) => new Date(b.creado_el || 0) - new Date(a.creado_el || 0));

                const lista = document.getElementById('lista-compartidos');
                lista.innerHTML = '';
                items.forEach(item => lista.appendChild(crearCardCompartido(item)));
                seccion.style.display = 'block';
            } catch (e) {
                console.error("Error al cargar compartidos:", e);
            }
        }

        function crearCardCompartido(item) {
            const card = document.createElement('div');
            card.className = 'card-stat';
            const res = TL.timeline.resumen(item.estadisticas);

            card.innerHTML = `
                <div class="match-top">
                    <div class="match-torneo">DE: ${TL.esc(item.de_email || 'otra cuenta')}</div>
                    <div class="match-acciones">
                        <button class="icon-btn btn-quitar" title="Quitar de mi historial">✕</button>
                    </div>
                </div>
                <div class="match-teams">
                    <div class="match-eq1">${TL.esc(item.mi_equipo || 'Equipo 1')}</div>
                    <div class="match-vs">vs</div>
                    <div class="match-eq2">${TL.esc(item.rival || 'Equipo 2')}</div>
                </div>
                <div class="match-meta">
                    <span class="match-fecha">${TL.esc(item.fecha || 'Sin fecha')}</span>
                    <span class="match-count"><b>${res.total}</b> cortes · ${res.categorias} cat</span>
                </div>
                <div class="tl-slot"></div>
            `;

            card.querySelector('.tl-slot').appendChild(TL.timeline.crear(item.estadisticas));

            card.onclick = () => {
                sessionStorage.setItem('compartidoSeleccionadoId', item.id);
                window.location.href = 'compartido.html';
            };

            card.querySelector('.btn-quitar').onclick = async (e) => {
                e.stopPropagation();
                if (!confirm('¿Quitar este compartido de tu historial?')) return;
                try {
                    await deleteDoc(doc(db, "compartidos", item.id));
                    cargarCompartidos();
                } catch (err) {
                    console.error(err);
                    alert('No se pudo quitar.');
                }
            };

            return card;
        }

        // --- Filtros: texto libre + categoría del club ---
        // Los dos se combinan (se aplican juntos), así que hay una sola función
        // que arma la lista y repinta; cada control solo cambia su variable.
        let categoriaActiva = '';   // '' = todas

        function aplicarFiltros() {
            const texto = (document.getElementById('buscador').value || '').toLowerCase();
            const filtrados = partidosGlobal.filter(p => {
                if (categoriaActiva && (p.mi_equipo || '') !== categoriaActiva) return false;
                if (!texto) return true;
                return (p.rival && p.rival.toLowerCase().includes(texto)) ||
                       (p.mi_equipo && p.mi_equipo.toLowerCase().includes(texto)) ||
                       (p.torneo && p.torneo.toLowerCase().includes(texto));
            });
            renderizarPartidos(filtrados);
        }

        // Las categorías salen de los partidos que hay, no de la lista del club:
        // así no se ofrecen filtros que no devolverían ningún resultado.
        function renderCategorias() {
            const row = document.getElementById('cat-row');
            const cont = document.getElementById('cat-chips');
            const cats = [...new Set(partidosGlobal.map(p => p.mi_equipo).filter(Boolean))]
                .sort((a, b) => a.localeCompare(b, 'es'));

            // Con una sola categoría el filtro no aporta nada
            if (cats.length < 2) { row.style.display = 'none'; return; }

            row.style.display = 'flex';
            cont.innerHTML = '';
            [{ valor: '', label: 'Todas' }, ...cats.map(c => ({ valor: c, label: c }))].forEach(o => {
                const chip = document.createElement('button');
                chip.className = 'cat-chip' + (o.valor === categoriaActiva ? ' activa' : '');
                chip.textContent = o.valor
                    ? `${o.label} · ${partidosGlobal.filter(p => p.mi_equipo === o.valor).length}`
                    : `${o.label} · ${partidosGlobal.length}`;
                chip.onclick = () => {
                    categoriaActiva = o.valor;
                    renderCategorias();
                    aplicarFiltros();
                };
                cont.appendChild(chip);
            });
        }

        document.getElementById('buscador').addEventListener('input', aplicarFiltros);

        // Iniciamos la carga
        window.onload = () => { pintarEncabezado(); cargarHistorial(); cargarCompartidos(); };
    </script>
</body>
</html>
